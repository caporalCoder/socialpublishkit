name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . build ruff
      - run: ruff check --select F,E9 socialpublishkit tests tools
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m build
  javascript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci && npm test && npm run typecheck && npm pack --dry-run
        working-directory: sdks/javascript
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - run: cargo +1.98.0 fmt --manifest-path sdks/rust/Cargo.toml -- --check
      - run: cargo +1.98.0 test --manifest-path sdks/rust/Cargo.toml --locked
      - run: cargo +1.98.0 clippy --manifest-path sdks/rust/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo +1.98.0 publish --manifest-path sdks/rust/Cargo.toml --dry-run --locked
  rust-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 check --manifest-path sdks/rust/Cargo.toml --locked
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - run: python tools/verify_packages.py
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: rustup toolchain install 1.98.0 --profile minimal
      - run: python -m pip install .
      - run: python tests/check_sdk_clients.py
