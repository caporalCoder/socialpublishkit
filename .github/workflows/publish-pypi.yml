name: Publish to PyPI
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Require a matching release tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os, tomllib
          with open('pyproject.toml', 'rb') as source:
              version = tomllib.load(source)['project']['version']
          assert os.environ['RELEASE_REF'] == f'refs/tags/v{version}', 'Run from the matching release tag'
          PY
      - run: python -m pip install . build twine
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/socialpublishkit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
