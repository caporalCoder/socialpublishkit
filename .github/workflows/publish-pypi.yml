name: Publish to PyPI
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Require a matching release tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os, tomllib
          with open('pyproject.toml', 'rb') as source:
              version = tomllib.load(source)['project']['version']
          assert os.environ['RELEASE_REF'] == f'refs/tags/v{version}', 'Run from the matching release tag'
          PY
      - run: python -m pip install . build twine
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/socialpublishkit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
